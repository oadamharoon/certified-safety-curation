  # ==================================================================
  # METADRIVE: realistic driving simulator (DSRL offline data available)
  # 9 tasks: Easy/Medium/Hard × Sparse/Mean/Dense traffic
  # Offline env IDs use old `gym` registry: OfflineMetadrive-{level}{density}-v0
  # Online env class: from dsrl.offline_metadrive.gym_envs import EasySparseEnv etc.
  # data_source: "metadrive" → pipeline uses MetaDrive adapter in env_utils.
  # Seeds stored at reset time → rendering matches collection exactly.
  # ==================================================================

  # -- Easy (map: SCS straight road, start_seed: 0) --
  metadrive_easy_sparse:
    env_name: "EasySparseEnv"
    metadrive_task: "easy_sparse"        # key into utils/metadrive_utils.TASK_CONFIGS
    offline_env_name: "OfflineMetadrive-easysparse-v0"
    dsrl_hdf5: "/home/prajwal/.dsrl/datasets/SafeMetaDrive-easysparse-v0-85-1000.hdf5"
    data_pickle: "data/trajectories_metadrive_easy_sparse.pkl"
    output_dir: "outputs/metadrive_easy_sparse_h10"
    prompt_template: "prompts/safety_metadrive.txt"
    wandb_run_name: "metadrive_easy_sparse"
    data_source: "metadrive"
    frame_selection: "cost_aware"
    vlm_strategy: "pairwise"             # canonical PLARE-style comparison (v2 setup)
    cpl_dropout: 0.0
    render_image_size: 480               # chase-view render width (height scaled 4:3)
    # MetaDrive's per-step cost is ~binary (a single 1 at the terminating
    # out_of_road / crash event), so a safety-gym-style contrast >= 2.0
    # would never trigger here.
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 10                       # DSRL/FSRL convention for metadrive (was 25 from safety-gym default)
    collect:
      n_episodes: 300
      max_steps_per_episode: 500
      seed_offset: 300000                # ignored for metadrive (uses ep_idx)
      use_bc_policy: true
      bc_action_noise: 0.15              # noise injection → safety variation across episodes

  # Methodology test: same env as metadrive_easy_sparse but with the three
  # crash-`done` flags disabled, so violations accumulate cost (1.0/step)
  # without terminating the episode. Lets unsafe segments contain many cost
  # steps (denser CPL signal density, matches PLARE's MetaWorld regime).
  # Run with max_steps_per_episode=1000 to allow full survive-or-arrive runs.
  metadrive_easy_sparse_nonterm:
    env_name: "EasySparseEnv"
    metadrive_task: "easy_sparse"
    metadrive_nonterminal: true
    offline_env_name: "OfflineMetadrive-easysparse-v0"
    dsrl_hdf5: "/home/prajwal/.dsrl/datasets/SafeMetaDrive-easysparse-v0-85-1000.hdf5"
    data_pickle: "data/trajectories_metadrive_easy_sparse_nonterm.pkl"
    output_dir: "outputs/metadrive_easy_sparse_nonterm_h10"
    prompt_template: "prompts/safety_metadrive.txt"
    wandb_run_name: "metadrive_easy_sparse_nonterm"
    data_source: "metadrive"
    frame_selection: "cost_aware"
    vlm_strategy: "pairwise"
    cpl_dropout: 0.0
    render_image_size: 480
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 10                       # now actually meaningful — episodes can exceed this
    collect:
      n_episodes: 300
      max_steps_per_episode: 1000        # full horizon so episodes can run to arrive_dest
      seed_offset: 0
      use_bc_policy: true
      bc_action_noise: 0.15               # used only if auto_calibrate is absent / disabled
      auto_calibrate:                     # bisect bc_action_noise to hit a target cost distribution
        n_pilot: 15
        target_frac: [0.30, 0.50]         # 30–50% of pilot episodes have cost > 0
        target_cost_when_violating: [5, 30]  # mean cost (across violating episodes) in [5, 30]
        sigma_lo: 0.05
        sigma_hi: 0.60
        max_iter: 5

  # ----- HARDER ENV: medium_dense (XST map with intersection + 0.30 traffic) -----
  # Both terminal and non-terminal variants for the dilution-vs-something-else test.
  # Auto-calibration uses the median-of-violating-costs metric (robust to tail)
  # and 30 pilot episodes per bisection iteration for stable convergence.
  metadrive_medium_dense:
    env_name: "MediumDenseEnv"
    metadrive_task: "medium_dense"
    offline_env_name: "OfflineMetadrive-mediumdense-v0"
    dsrl_hdf5: "/home/prajwal/.dsrl/datasets/SafeMetaDrive-mediumdense-v0-50-1000.hdf5"
    data_pickle: "data/trajectories_metadrive_medium_dense.pkl"
    output_dir: "outputs/metadrive_medium_dense_h10"
    prompt_template: "prompts/safety_metadrive.txt"
    wandb_run_name: "metadrive_medium_dense"
    data_source: "metadrive"
    frame_selection: "cost_aware"
    vlm_strategy: "pairwise"
    cpl_dropout: 0.0
    render_image_size: 480
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 10
    # Trajectory-quality filters for the preference sampler. Empirically every
    # cost==0 episode in this dataset reaches the goal (length < horizon, no
    # violations possible), so cost==0 IS the structural "completed task safely"
    # definition — the reward filter would be a no-op so we omit it (-1 = off).
    # In terminal mode cost is binary {0,1}, so unsafe_min_cost = 1.0 is the
    # only possible "really unsafe" threshold.
    traj_safe_max_cost: 0.0                  # safe traj has cost == 0  (== arrived at destination)
    traj_safe_min_reward: -1.0               # disabled: redundant with cost==0 in this dataset
    traj_unsafe_min_cost: 1.0                # terminal mode: any cost event terminates, so 1 is the max
    collect:
      n_episodes: 300
      max_steps_per_episode: 1000
      seed_offset: 0
      use_bc_policy: true
      bc_action_noise: 0.15
      auto_calibrate:
        n_pilot: 30
        target_frac: [0.30, 0.50]
        target_cost_when_violating: [5, 30]
        sigma_lo: 0.05
        sigma_hi: 0.60
        max_iter: 5

  # ==================================================================
  # DSRL-convention MetaDrive tasks (Phase 9+). Use SafeMetaDriveEnv +
  # FSRL step wrapper to exactly mirror dsrl.offline_metadrive.gym_envs:
  # per-step velocity_cost + proximity_cost on top of single-step crash /
  # out_of_road cost, termination on arrive_dest OR crash OR out_of_road,
  # truncation on max_step. Constraint thresholds 10/20/40 are
  # calibrated against this configuration. Cost in these tasks is real-
  # valued (sum of small per-step velocity/proximity costs) rather than
  # binary; trajectory filters use cost-vs-threshold cutoffs.
  # ==================================================================
  metadrive_dsrl_medium_mean:
    env_name: "MediumMeanEnv"               # matches dsrl.offline_metadrive.gym_envs.MediumMeanEnv
    metadrive_task: "dsrl_medium_mean"      # key into utils/metadrive_utils.TASK_CONFIGS
    metadrive_dsrl: true                    # uses make_metadrive_env(dsrl=True)
    offline_env_name: "OfflineMetadrive-mediummean-v0"
    dsrl_hdf5: "/home/prajwal/.dsrl/datasets/SafeMetaDrive-mediummean-v0-50-1000.hdf5"
    data_pickle: "data/trajectories_metadrive_dsrl_medium_mean.pkl"
    output_dir: "outputs/metadrive_dsrl_medium_mean_h10"
    data_source: "metadrive"
    wandb_run_name: "metadrive_dsrl_medium_mean"
    prompt_template: "prompts/safety_metadrive.txt"
    wandb_run_name: "metadrive_dsrl_medium_mean"
    data_source: "metadrive"
    frame_selection: "cost_aware"
    vlm_strategy: "pairwise"
    cpl_dropout: 0.0
    render_image_size: 480
    # Cost is real-valued but our 300-episode collection is mostly binary at
    # the trajectory level: 29 eps cost==0 (perfect drives, reward 234-287),
    # 78 eps cost∈(0,1) (accumulated velocity/proximity but didn't terminate),
    # 193 eps cost∈[1,2) (terminated from crash/out_of_road + small velocity).
    # max episode cost = ~2, far below DSRL's claimed [0,50] range. Setting
    # cost_limit=10 to match DSRL's eval-time threshold, but in our data
    # this threshold is never exceeded; "safety" empirically means cost==0.
    cost_safe_threshold: 0.0                # segment cost <= 0 = safe (binary in practice)
    cost_contrast_min: 0.5                  # need |costA - costB| >= 0.5 for clear contrast
    cost_limit: 10                          # DSRL convention for medium tasks (eval-time use)
    # Trajectory-quality filters mirror Phase 5 terminal-mode pattern:
    # safe traj = cost==0 (the 29 perfect completions), unsafe traj = cost>=1
    # (the 193 terminating violations). This isolates the cleanest signal
    # for the preference sampler.
    traj_safe_max_cost: 0.0                 # safe traj: total cost == 0 (29 eps)
    traj_safe_min_reward: -1.0              # disabled (cost==0 trajs already have high reward)
    traj_unsafe_min_cost: 1.0               # unsafe traj: terminated from violation (193 eps)
    collect:
      n_episodes: 300
      max_steps_per_episode: 1000
      seed_offset: 0
      use_bc_policy: true
      bc_action_noise: 0.20
      auto_calibrate:
        n_pilot: 30
        # Targets are now on the DSRL cost scale (real-valued tens), not
        # binary. A "violating" episode is one with cost > 5; we want the
        # median-cost-of-violating episodes to fall in [10, 30] (above the
        # threshold but not in the catastrophic tail).
        target_frac: [0.30, 0.50]
        target_cost_when_violating: [10, 30]
        sigma_lo: 0.05
        sigma_hi: 0.80
        max_iter: 5

