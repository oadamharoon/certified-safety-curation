# =====================================================================
# Safety-VLM-CPL pipeline configuration
# Currently configured for SafetyPointGoal1 (DSRL offline dataset)
# =====================================================================

# ---- Reproducibility ----
seed: 0
# ---- Paths ----
raw_npz: "safety_point_goal_dsrl.npz"          # produced by data_collect.ipynb
data_pickle: "data/trajectories_pointgoal1.pkl" # default task: pointgoal1
output_dir: "outputs/pointgoal1_h50"
prompt_template: "prompts/safety_pointgoal.txt" # change per task

# ---- Environment ----
# Offline (BC/CPL training data): "OfflinePointGoal1Gymnasium-v0"
# Online (rendering + evaluation): "SafetyPointGoal1Gymnasium-v0"
env_name: "SafetyPointGoal1Gymnasium-v0"
offline_env_name: "OfflinePointGoal1Gymnasium-v0"

# ---- Segmentation ----
segment_length: 50
segment_stride: 50          # non-overlapping segments

# ---- Filtering ----
# PointGoal obs is 60-dim lidar; we cannot use obs-based xy displacement.
# Instead filter on a minimum sum-of-rewards (positive progress).
min_total_reward: 0.05      # at least some forward progress over the segment
drop_zero_segments: true    # drop segments with both ~0 reward and ~0 cost

# ---- Pair sampling ----
num_pairs: 1000             # value used for every task reported in the paper
cost_safe_threshold: 0.0
cost_contrast_min: 1.0
max_active_segments: 100000

# ---- Rendering ----
frames_per_segment: 5       # more frames helps small open-source VLMs
render_image_size: 256      # passed to safety-gymnasium where supported

# ---- VLM ----
# Backend: "openai" | "openrouter" | "hf" (local Hugging Face).
vlm_backend: "hf"

# Model id depends on backend.
#
# === backend == "openai" ===
#   gpt-4o-mini          # cheap, fast, good multi-image
#   gpt-4o               # strongest OpenAI multimodal
#   gpt-4.1-mini         # newer cheap tier
#   gpt-4.1
#
# === backend == "openrouter" ===  (full list: https://openrouter.ai/models?modality=image)
#   openai/gpt-4o-mini                       # ~$0.15 / 1M in
#   openai/gpt-4o
#   anthropic/claude-3.5-sonnet              # very strong on multi-image
#   anthropic/claude-3-haiku                 # cheap claude
#   google/gemini-2.0-flash-001              # cheap, fast, native multi-image
#   google/gemini-2.5-pro                    # premium
#   meta-llama/llama-3.2-90b-vision-instruct # open-weight via OR
#   qwen/qwen2.5-vl-72b-instruct             # open-weight via OR
#   mistralai/pixtral-12b
#
# === backend == "hf" (local) ===
#   Qwen/Qwen2-VL-7B-Instruct                # ~16 GB VRAM
#   openbmb/MiniCPM-V-2_6                    # ~17 GB VRAM
#   HuggingFaceTB/SmolVLM-Instruct           # ~5 GB
vlm_model: "Qwen/Qwen2.5-VL-7B-Instruct"

# --- Auth ---
openai_api_key: ""            # backend==openai (else OPENAI_API_KEY env var)
openrouter_api_key: ""        # backend==openrouter (else OPENROUTER_API_KEY env var)
openrouter_base_url: "https://openrouter.ai/api/v1"
openrouter_referer: ""        # optional: your project URL (for OpenRouter analytics)
openrouter_app_title: "safety-vlm-cpl"

max_tokens: 500
temperature: 0.2
vlm_retries: 3
vlm_strategy: "pairwise"     # "pairwise" (original) or "rating" (ERL-VLM-style absolute Likert)
rating_scale: 5              # only used when vlm_strategy=="rating"; integer ratings in [0, scale-1]

# ---- CPL training ----
bc_pretrain_epochs: 50
cpl_epochs: 300
batch_size: 512
learning_rate: 0.0003
lambda_bc: 0.1              # auxiliary BC weight during CPL phase
temperature_cpl: 1.0        # softmax temperature (acts as 1/beta)
hidden_dim: 256
cpl_dropout: 0.0             # 0 = original behavior; PLARE uses 0.25 for VLM-label noise mitigation
log_every: 5

# ---- Evaluation ----
eval_episodes: 100
bc_only_epochs: 100
cost_limit: 25              # episode-level cost budget; matches DSRL convention
deterministic: true

# ---- W&B logging ----
use_wandb: true
wandb_project: "safety-vlm-cpl"
wandb_run_name: "pointgoal_v2_200k"
wandb_entity: null          # set to your W&B entity, or leave null

# =====================================================================
# TASK REGISTRY
# Usage:  python scripts/01_segment_and_filter.py --task cargoal1
#
# Each task entry overrides only the keys that differ from the defaults
# above. Everything else (VLM settings, training hyperparams, etc.)
# is inherited from the shared defaults.
#
# data_source:
#   "dsrl"   – use env.get_dataset() (offline expert data, no seeds stored)
#   "online" – use 00_collect_online_data.py (seeds stored, replay matches)
#
# Three environment families available:
#   1. Safety-Gymnasium (Point/Car/Ant robot): has DSRL offline data
#   2. Bullet-Safety-Gym (Ball/Car/Ant/Drone): FSRL only, online collection
#   3. MuJoCo Velocity (HalfCheetah/Ant/etc): cost = velocity limit violation
# =====================================================================
tasks:
  pointgoal2:
    env_name: "SafetyPointGoal2Gymnasium-v0"
    offline_env_name: "OfflinePointGoal2Gymnasium-v0"
    data_pickle: "data/trajectories_pointgoal2.pkl"
    output_dir: "outputs/pointgoal2_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointgoal2_dsrl"
    data_source: "dsrl"

    traj_safe_max_cost: 25.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 123.0
  pointcircle1:
    env_name: "SafetyPointCircle1Gymnasium-v0"
    offline_env_name: "OfflinePointCircle1Gymnasium-v0"
    data_pickle: "data/trajectories_pointcircle1.pkl"
    output_dir: "outputs/pointcircle1_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointcircle1_dsrl"
    data_source: "dsrl"

    traj_safe_max_cost: 57.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 168.0
  pointcircle2:
    env_name: "SafetyPointCircle2Gymnasium-v0"
    offline_env_name: "OfflinePointCircle2Gymnasium-v0"
    data_pickle: "data/trajectories_pointcircle2.pkl"
    output_dir: "outputs/pointcircle2_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointcircle2_dsrl"
    data_source: "dsrl"

    traj_safe_max_cost: 45.5
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 181.0
  pointbutton1:
    env_name: "SafetyPointButton1Gymnasium-v0"
    offline_env_name: "OfflinePointButton1Gymnasium-v0"
    data_pickle: "data/trajectories_pointbutton1.pkl"
    output_dir: "outputs/pointbutton1_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointbutton1_dsrl"
    data_source: "dsrl"

    traj_safe_max_cost: 24.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 122.0
  ant_velocity:
    # Phase 12e-14: AntVelocity. PReSa + PREFINE benchmark.
    # 2249 trajs, 2.1M trans. obs_dim=27, act_dim=8.
    # MAX_R=2976, MAX_C=250. p25=25, p75=191. 20% safe at thr=20.
    env_name: "SafetyAntVelocityGymnasium-v1"
    offline_env_name: "OfflineAntVelocityGymnasium-v1"
    data_pickle: "data/trajectories_ant_velocity.pkl"
    output_dir: "outputs/ant_velocity_h50"
    wandb_run_name: "ant_velocity_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 20
    traj_safe_max_cost: 25.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 191.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  hopper_velocity:
    # Phase 12e-14: HopperVelocity. PReSa + PREFINE benchmark.
    # 2240 trajs, 1.3M trans. obs_dim=11, act_dim=3.
    # MAX_R=1911, MAX_C=250. p25=50, p75=186. 11% safe at thr=20.
    # Variable-length trajectories (med=551, max=1000) — hopper terminates on fall.
    env_name: "SafetyHopperVelocityGymnasium-v1"
    offline_env_name: "OfflineHopperVelocityGymnasium-v1"
    data_pickle: "data/trajectories_hopper_velocity.pkl"
    output_dir: "outputs/hopper_velocity_h50"
    wandb_run_name: "hopper_velocity_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 20
    traj_safe_max_cost: 50.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 186.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  walker2d_velocity:
    # Phase 12e-14: Walker2dVelocity. PReSa + PREFINE + PbCRL (triple coverage).
    # 2729 trajs, 2.1M trans. obs_dim=17, act_dim=6.
    # MAX_R=3418, MAX_C=300. p25=14, p75=162. 28% safe at thr=20.
    env_name: "SafetyWalker2dVelocityGymnasium-v1"
    offline_env_name: "OfflineWalker2dVelocityGymnasium-v1"
    data_pickle: "data/trajectories_walker2d_velocity.pkl"
    output_dir: "outputs/walker2d_velocity_h50"
    wandb_run_name: "walker2d_velocity_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 20
    traj_safe_max_cost: 14.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 162.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  swimmer_velocity:
    # Phase 12e-14: SwimmerVelocity. PReSa + PREFINE benchmark.
    # 1686 trajs, 1.7M trans. obs_dim=8, act_dim=2.
    # MAX_R=239, MAX_C=200. p25=40, p75=138. 14% safe at thr=20.
    env_name: "SafetySwimmerVelocityGymnasium-v1"
    offline_env_name: "OfflineSwimmerVelocityGymnasium-v1"
    data_pickle: "data/trajectories_swimmer_velocity.pkl"
    output_dir: "outputs/swimmer_velocity_h50"
    wandb_run_name: "swimmer_velocity_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 20
    traj_safe_max_cost: 40.25
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 138.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  halfcheetah_velocity:
    # Phase 12e-6: HalfCheetahVelocity. Locomotion task with velocity-threshold
    # cost (very different from collision-based goal tasks). Tested by PReSa,
    # PREFINE, and PbCRL. 2495 trajs, 2.5M transitions.
    # MAX_R=2807, MAX_C=250. Action dim 6, obs dim 17 (small obs, big action).
    # 18% safe at threshold 20.
    env_name: "SafetyHalfCheetahVelocityGymnasium-v1"
    offline_env_name: "OfflineHalfCheetahVelocityGymnasium-v1"
    data_pickle: "data/trajectories_halfcheetah_velocity.pkl"
    output_dir: "outputs/halfcheetah_velocity_h50"
    wandb_run_name: "halfcheetah_velocity_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 20                          # DSRL "Velocity" task standard
    traj_safe_max_cost: 35.0                # placeholder; runner overrides
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 184.0             # placeholder; runner overrides
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  cargoal1_dsrl:
    # Phase 12e-3: CarGoal1 standard DSRL benchmark. Tested by both PReSa
    # AND PREFINE. Data from DSRL hdf5 (1671 trajectories, 1.7M trans).
    # Cost distribution: 20% safe at threshold 10, 40% at 25, 54% at 40.
    # MAX_R=39.91, MAX_C=120. p25 cost=13, p75 cost=69.
    env_name: "SafetyCarGoal1Gymnasium-v0"
    offline_env_name: "OfflineCarGoal1Gymnasium-v0"
    data_pickle: "data/trajectories_cargoal1_dsrl.pkl"
    output_dir: "outputs/cargoal1_dsrl_h50"
    prompt_template: "prompts/safety_cargoal.txt"
    wandb_run_name: "cargoal1_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25
    # NOTE: runner computes percentile thresholds at runtime (these are
    # placeholders; the principled runner overrides them).
    traj_safe_max_cost: 13.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 69.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  pointgoal1_dsrl:
    # Phase 12e: PointGoal1 standard DSRL benchmark. Tested by both PReSa
    # AND PREFINE explicitly. Data from DSRL hdf5 (2022 trajectories
    # of 1000 steps, multi-policy mix), loaded via env.get_dataset().
    # Cost distribution: 30% safe at threshold 10, 46% at 20, 67% at 40
    # (better safe/unsafe balance than CarGoal2). MAX_R=30.07, MAX_C=100.
    env_name: "SafetyPointGoal1Gymnasium-v0"
    offline_env_name: "OfflinePointGoal1Gymnasium-v0"
    data_pickle: "data/trajectories_pointgoal1_dsrl.pkl"
    output_dir: "outputs/pointgoal1_dsrl_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointgoal1_dsrl"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25                          # DSRL "Goal" task standard
    # Trajectory-level filters: principled, cost_limit-anchored.
    # safe   = cost <= cost_limit / 2   (12.5 -> 754 trajs, mean R = 9)
    # unsafe = cost >= cost_limit * 1.5 (37.5 -> 698 trajs, mean R = 16)
    # PREFINE-aligned: anchors safe/unsafe pools to the task's actual
    # safety budget rather than hand-picked numbers.
    traj_safe_max_cost: 6.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 49.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000             # FULL data; no segment cap

  cargoal2:
    # Phase 12c: Standard DSRL benchmark setup matching PReSa / PREFINE / PbCRL.
    # Data comes from DSRL's published hdf5 (4105 trajectories of 1000 steps,
    # multi-policy mix) loaded via env.get_dataset(). NO online collection.
    # Cost distribution: 20% safe at threshold 10, 42% safe at threshold 40
    # (DSRL constraint-variation thresholds). Reward/cost tradeoff: safe
    # trajectories have LOWER R than unsafe (5.7 vs 13.2 mean) — agents
    # sacrifice reward to avoid hazards.
    env_name: "SafetyCarGoal2Gymnasium-v0"
    offline_env_name: "OfflineCarGoal2Gymnasium-v0"
    data_pickle: "data/trajectories_cargoal2.pkl"
    output_dir: "outputs/cargoal2_h50"
    prompt_template: "prompts/safety_cargoal.txt"
    wandb_run_name: "cargoal2_dsrl"
    data_source: "dsrl"
    # Segment-level safety threshold: per-segment cost <= 0 = safe (binary).
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25                          # DSRL "Goal" task standard threshold
    # Trajectory-level filters for preference pool construction.
    # safe trajectory  = total cost <=  5 (671 trajectories, mean R = 5.7)
    # unsafe trajectory = total cost >= 30 (2674 trajectories, mean R = 13.2)
    traj_safe_max_cost: 16.0
    traj_safe_min_reward: -1.0              # disabled (cost is the discriminator)
    traj_unsafe_min_cost: 115.0
    # Compute budget. Default 350 BC epochs + 300 V_epochs + 300 AWR epochs
    # is too expensive on 4.1M-transition data. Empirically BC converges
    # by epoch 50 here (loss 0.016 vs initial 0.31). Use lower counts to
    # keep multi-seed runs tractable while still saturating convergence.
    bc_only_epochs: 100
    batch_size: 512
    # IMPORTANT: override default 10000 cap so BC trains on the FULL data
    # (87K active segments after filtering, ~2.6M state-action pairs).
    # The 10000 cap was a metadrive-era default; with cargoal2's 4105
    # trajectories the cap throws away 87% of available data and makes BC
    # strictly weaker than PReSa's BC-All. Use a number above the actual
    # count to keep all segments.
    max_active_segments: 100000
  pointbutton2:
    env_name: "SafetyPointButton2Gymnasium-v0"
    offline_env_name: "OfflinePointButton2Gymnasium-v0"
    data_pickle: "data/trajectories_pointbutton2.pkl"
    output_dir: "outputs/pointbutton2_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "pointbutton2"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25
    traj_safe_max_cost: 38.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 155.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  carbutton2:
    env_name: "SafetyCarButton2Gymnasium-v0"
    offline_env_name: "OfflineCarButton2Gymnasium-v0"
    data_pickle: "data/trajectories_carbutton2.pkl"
    output_dir: "outputs/carbutton2_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "carbutton2"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25
    traj_safe_max_cost: 45.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 196.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000

  carbutton1_t3:
    env_name: "SafetyCarButton1Gymnasium-v0"
    offline_env_name: "OfflineCarButton1Gymnasium-v0"
    data_pickle: "data/trajectories_carbutton1_full.pkl"
    output_dir: "outputs/carbutton1_t3_h50"
    prompt_template: "prompts/safety_pointgoal.txt"
    wandb_run_name: "carbutton1_t3"
    data_source: "dsrl"
    cost_safe_threshold: 0.0
    cost_contrast_min: 1.0
    cost_limit: 25
    traj_safe_max_cost: 45.0
    traj_safe_min_reward: -1.0
    traj_unsafe_min_cost: 169.0
    bc_only_epochs: 100
    batch_size: 512
    max_active_segments: 100000
